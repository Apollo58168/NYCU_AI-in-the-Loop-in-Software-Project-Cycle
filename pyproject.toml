[project]
name = "decisiontrace"
version = "0.1.0"
description = "AI-assisted decision memory for student software teams"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decisiontrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
